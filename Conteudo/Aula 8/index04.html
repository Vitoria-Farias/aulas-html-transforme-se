<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalhando com ID</title>

    <style>
      .cidade {
        background-color: rgb(32, 8, 119);
        border: 2px solid black;
        margin-bottom: 20px;
        color: rgb(203, 77, 235);
        justify-items: center;
      }
      #fundo-azul{
        background-color: rgb(4, 4, 129);
      }
    </style>

  </head>
  <body>
    <h1>Utilizando ID</h1>

    <div class="cidade" id="fundo-azul">
      <h2>São Paulo</h2>
      <p>É uma cidade de São Paulo</p>
    </div>

    <div class="cidade">
      <h2>Natal</h2>
      <p>É uma cidade de Rio Grande do Norte</p>
    </div>

    <div class="cidade">
      <h2>Rio de Janeiro</h2>
      <p>É uma cidade do Rio de Janeiro</p>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Navegação</title>

    <style>

      body {
        margin: 0;
        padding: 0;
      }

      ul {
        margin: 0px 0px;
        padding: 0;
        list-style: none;
        display: flex;
        gap: 50px;
        justify-content: center;
        background-color: rgb(70, 128, 214);
      }

      li {
        padding: 30px 0px;
      }

      li a {
        text-decoration: none;
        color: rgb(66, 3, 66);
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
      }

      li a:hover{
        transition: 0.5s;
        color: antiquewhite;
      }

    </style>

  </head>
  <body>

    <ul>
      <li><a href="">Home</li>
      <li><a href="">Sobre Mim</li>
      <li><a href="">Contatos</li>
    </ul>

  </body>
</html>
